# Opt-in only: `SSH_AUTH_SOCK="$SSH_AUTH_SOCK" docker compose -f compose.yaml
# -f compose.agent.yaml up`. Never start this override with an unset socket.
services:
  api:
    volumes:
      - ${SSH_AUTH_SOCK:?set SSH_AUTH_SOCK to opt into agent forwarding}:/run/ssh-agent.sock
    environment:
      SSH_AUTH_SOCK: /run/ssh-agent.sock
      DAVE_USE_SSH_AGENT: "true"
  worker:
    volumes:
      - ${SSH_AUTH_SOCK:?set SSH_AUTH_SOCK to opt into agent forwarding}:/run/ssh-agent.sock
    environment:
      SSH_AUTH_SOCK: /run/ssh-agent.sock
      DAVE_USE_SSH_AGENT: "true"

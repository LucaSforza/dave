[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dave-backend"
version = "0.1.0"
description = "Local FastAPI and Redis controller for DAVE cluster sessions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "redis>=5,<7",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = ["fakeredis[lua]>=2.25,<3", "pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["dave_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../client"]
